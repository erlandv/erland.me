name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target release SHA (empty for previous)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.SITE_URL }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=60 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o AddressFamily=inet -o PreferredAuthentications=publickey
    steps:
      # --- SSH setup ---
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 60 -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --- List available releases ---
      - name: Show available releases (top ${{ vars.KEEP_RELEASES }})
        run: |
          set -euo pipefail
          # List releases sorted by newest first, then show only the top N
          ssh -p "${{ secrets.SSH_PORT }}" $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "ls -1dt ${{ vars.DEPLOY_BASE_DIR }}/releases/*/ 2>/dev/null | head -n ${{ vars.KEEP_RELEASES }} || true"

      # --- Capture current SHA before rollback (needed for --previous verification) ---
      - name: Capture pre-rollback SHA
        run: |
          set -euo pipefail
          ROOT_URL="${{ env.SITE_URL }}"
          PRE_SHA="$(curl -fsSL --max-time 15 -H "Cache-Control: no-cache" \
            "${ROOT_URL}/version.json?t=$(date +%s)" | jq -r '.sha // empty' || true)"
          echo "Pre-rollback SHA: ${PRE_SHA:-unknown}"
          echo "PRE_ROLLBACK_SHA=${PRE_SHA}" >> "$GITHUB_ENV"

      # --- Execute rollback ---
      - name: Rollback
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          # Build rollback command: use specific SHA if provided, otherwise fallback to previous release
          CMD="sudo astro-rollback"
          if [[ -n "${TARGET_SHA}" ]]; then
            CMD="$CMD --to ${TARGET_SHA}"
          else
            CMD="$CMD --previous"
          fi
          # Show command and execute it on the remote host
          echo "Running: $CMD"
          ssh -p "${{ secrets.SSH_PORT }}" $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "$CMD"

      # --- HTTP Health checks after rollback ---
      - name: Verify rollback success
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          ROOT_URL="${{ env.SITE_URL }}"
          echo "Waiting 5 seconds for rollback to complete..."
          sleep 5
          # Verify site is accessible after rollback
          STATUS="$(curl -fsS -o /dev/null -w "%{http_code}" -L --max-time 15 --retry 5 --retry-connrefused -H "Cache-Control: no-cache" "${ROOT_URL}/?t=$(date +%s)")"
          test "$STATUS" -eq 200 || { echo "Site not accessible after rollback (HTTP $STATUS)"; exit 1; }
          # Verify version.json reflects the correct release after rollback.
          # HTTP 200 alone cannot detect a failed symlink swap (Nginx may still serve
          # the old/broken release). Checking version.json proves the swap succeeded.
          VERSION_JSON="$(curl -fsSL --max-time 15 --retry 5 --retry-connrefused -H "Cache-Control: no-cache" "${ROOT_URL}/version.json?t=$(date +%s)")"
          CURRENT_SHA="$(echo "$VERSION_JSON" | jq -r '.sha // empty' || true)"
          if [[ -n "${TARGET_SHA}" ]]; then
            # Specific SHA rollback: version.json must match the requested SHA exactly
            [[ "${CURRENT_SHA}" == "${TARGET_SHA}" ]] \
              || { echo "version.json SHA mismatch: expected ${TARGET_SHA}, got ${CURRENT_SHA}"; echo "$VERSION_JSON"; exit 1; }
            echo "Rollback successful — now serving SHA ${TARGET_SHA}"
          else
            # Previous release rollback: SHA must have changed from pre-rollback state
            if [[ -n "${PRE_ROLLBACK_SHA}" && "${CURRENT_SHA}" == "${PRE_ROLLBACK_SHA}" ]]; then
              echo "SHA unchanged after rollback (was: ${PRE_ROLLBACK_SHA}, still: ${CURRENT_SHA}) — symlink may not have swapped"
              echo "$VERSION_JSON"
              exit 1
            fi
            echo "Rollback successful — was: ${PRE_ROLLBACK_SHA:-unknown}, now: ${CURRENT_SHA:-unknown}"
          fi
